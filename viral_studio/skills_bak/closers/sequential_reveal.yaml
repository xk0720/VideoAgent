skill_id: sequential_reveal
kind: closer
name: 多人相继出镜(收尾)
source: demo_v01.py 段落 A(原为开场, 按裁决改作收尾)

applies_to:
  categories: [服装]
  person_count: [2, 3]        # 1 人整段跳过(同框才有"相继出镜"可言)
  placement: ending

produces:
  durations: {"2": 4, "3": 6}         # 每人 2s
  tail_s: 0.5                          # 尾部余量: 让最后一击响完(见 caveats)
  audio_mode: music_only

audio:
  bgm_source: generated       # 现生成卡点音乐, 再用 punch_up 把落点砸实

# 本卡 = 一次生成整段(多人同框, 非逐人拼接): 背景钉首帧 → 生成 → 配乐 → 强化 → 混音 → 烧标题
prompt_source:
  "2": prompt_2p
  "3": prompt_3p

pipelines:
  "2":
    - id: vid
      tool: kling_omni_video
      params: {prompt: $prompt, audio: false, duration: 4,
               first_frame: $background,      # 背景钉为首帧, 不占 <<<image_N>>> 编号
               refer: [$hook_1, $hook_2]}
    - id: music
      tool: sonilo_text_to_music
      params: {prompt: $skill.music_prompt, duration: 6}    # 段长+2, 给最后一击留衰减
    - id: punch
      tool: punch_up
      local: true
      params: {audio: "@music", beats: [2, 4], gain: 0.85, trim_to: 4.5}
    - id: mixed
      tool: mix_audio
      local: true
      params: {video: "@vid", bgm: "@punch", duration: 4.5, bgm_volume: 1.0}
    - id: out
      tool: burn_text
      local: true
      params: {video: "@mixed", text: "{title}", y_frac: 0.16, size: 76}
  "3":
    - id: vid
      tool: kling_omni_video
      params: {prompt: $prompt, audio: false, duration: 6,
               first_frame: $background,
               refer: [$hook_1, $hook_2, $hook_3]}
    - id: music
      tool: sonilo_text_to_music
      params: {prompt: $skill.music_prompt, duration: 8}
    - id: punch
      tool: punch_up
      local: true
      params: {audio: "@music", beats: [2, 4, 6], gain: 0.85, trim_to: 6.5}
    - id: mixed
      tool: mix_audio
      local: true
      params: {video: "@vid", bgm: "@punch", duration: 6.5, bgm_volume: 1.0}
    - id: out
      tool: burn_text
      local: true
      params: {video: "@mixed", text: "{title}", y_frac: 0.16, size: 76}

# ── 2 人版: 跳舞出场 —— 0-2s 左人跳入, 2-4s 右人加入, 合跳收尾 ──────
prompt_2p: |
  Locked-off static camera, vertical 9:16. The exact background of this shot —
  a phone frame over a pink-and-green pastel sunburst with sparkle stickers —
  stays fixed and unchanged for the whole clip. A 4-second video.
  0-2s: the woman from <<<image_1>>> dances into the frame from the left with a
  playful bouncy two-step, arms swinging to the beat, and settles slightly left
  of center still bouncing lightly in rhythm.
  2-4s: the woman from <<<image_2>>> dances in from the right with the same bouncy
  two-step and lands at her side; side by side, the two do the SAME simple dance
  move in perfect sync — step-touch left, step-touch right, one playful hip sway —
  facing the camera and smiling, ending together on a final accent pose.
  Keep the choreography simple and rhythmic; no spins, no jumps off the ground,
  no complex arm choreography.
  Both women are rendered at exactly the SAME scale and the SAME distance from
  the camera — heads at the same height, bodies the same size, symmetrically
  placed about the center. Neither is larger or closer than the other; they are
  not photographs or cards, they are two equally sized cut-out figures.
  Each woman keeps her own face, hairstyle and outfit exactly as in her
  reference image. No morphing between people, no blending of faces, no extra
  people. Cut-out sticker look with a thin white outline around each woman,
  matching the reference background's collage style. No text, no captions, no
  camera movement.

# ── 3 人版: 0-2s 中, 2-4s 左, 4-6s 右 ────────────────────────────
prompt_3p: |
  Locked-off static camera, vertical 9:16. The exact background of this shot —
  a phone frame over a pink-and-green pastel sunburst with sparkle stickers —
  stays fixed and unchanged for the whole clip. A 6-second video.
  0-2s: the woman from <<<image_1>>> pops into the center of the phone frame, landing
  in a confident standing pose with one hand on her hip.
  2-4s: the woman from <<<image_2>>> pops in and stands to her left; both stay on
  screen holding their poses.
  4-6s: the woman from <<<image_3>>> pops in and stands to her right; all three stand
  in a row facing the camera, smiling.
  All three women are rendered at exactly the SAME scale and the SAME distance
  from the camera — their heads at the same height, their bodies the same size,
  evenly spaced across the frame. None of them is larger, closer or further
  back than the others; they are not photographs or cards, they are three
  equally sized cut-out figures standing side by side.
  Each woman keeps her own face, hairstyle and outfit exactly as in her
  reference image. No morphing between people, no blending of faces, no extra
  people. Cut-out sticker look with a thin white outline around each woman,
  matching the reference background's collage style. No text, no captions, no
  camera movement.

background:                   # 有现成图直接用; 想改成现生成, 把本行置空并在
  default_image: examples/bg/v01_opening_bg.jpg   # pipeline 首位加一步 image_generation
  background_prompt: |
    Vertical 9:16 flat-lay graphic background, a smartphone frame centered on a
    pastel pink-and-green sunburst pattern, white sparkle stickers scattered
    around, small UI icons (comment, heart, share) at the bottom, bright and
    clean, no people, no text.

music_prompt: |
  Upbeat fashion-haul intro, 120 BPM, punchy electronic drums, strong kick and
  clap accents landing exactly on {beats_text}, short riser sweeps building
  into each accent, bright synth plucks, crisp hi-hats, energetic and clean,
  no vocals.

text_params:
  title: {lang: zh, chars: [4, 10]}     # 收尾标题, 后期烧(不指望模型写中文)

measured:
  verified: true
  date: 2026-08-16
  notes: 3 人版实测时序精准(1s一人/2.5s两人/4.5s三人), 背景完美复刻, 三人未串脸
  caveats:
    - 实测第2、3人曾以"照片卡片"形式且偏小 → prompt 已加同尺寸/同景深/等距约束
    - 最后一击需 ~0.55s 衰减 → 音乐多生成 2s、裁到 段长+0.5s、画面同步延长(末帧克隆=定格)
    - 否则拼接后该击被后段音频覆盖, 成片里等于消失(实测强度 0.00)
    - 配乐选型: text-to-music 偏差 0.035s 优于 video-to-music 0.085s; 生成音乐准而不狠, 必须叠 punch_up
    - 2 人版 2026-08-31 改为跳舞双人出场(用户裁决); 舞步刻意限定简单节奏型
      (step-touch+hip sway, 禁旋转/跳跃/复杂手部), 降低生成崩坏面; 尚未实跑
