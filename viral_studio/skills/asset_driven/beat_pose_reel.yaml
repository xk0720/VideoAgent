skill_id: beat_pose_reel
kind: asset_driven
name: 同装多机位卡点连拍(动作迁移)
source: examples/new/yike/viral_video1.mp4 拆解 2026-08-31
priority: 10          # opening 位有多张卡时优先选它(beat_reel 为兜底)

applies_to:
  categories: [服装]
  person_count: [1, 2]
  placement: opening

produces:
  duration_s: 8.566
  audio_mode: none        # 无口播, 纯 BGM 卡点

audio:
  bgm_source: asset       # 直接用原片音轨 —— 保持原片切点时序, 卡点零成本继承

# 套路骨架(量化自原片前 9 镜 / 8.566s): 变速卡点, 开头 0.6s 级三连快切抓人;
# 变化维度: 景别 x 角度 x 姿势。
# 镜头边界 = 用户逐帧裁决(meta.frame_ranges), 帧号硬切, 构造上无串帧。
# 景别档位 = cv2 客观测量(脸高/画面高中位数, framing_measure.json), 不再肉眼定档
#   —— 初版肉眼把 s01 标成全身, 实测 0.249 是全场最紧的近景。
# 生产分工与实测依据:
#   · animate 逐镜迁移动作(硬切整条喂会被抹成渐变); 短镜驱动已回文补帧过 2s
#     API 地板, 落位只取开头真实时长即原动作
#   · 输出取景跟随参考图而非驱动(实测) → 景别由 crop_ref 造: 近景槽喂胸像,
#     全景槽喂全身; 顺带去掉电商图页眉(否则进背景)
#   · 每镜 optional: FullFace/NoHuman 是确定性拒绝(预检 3/3 高危镜全过, 仍留
#     保险); 被拒槽位由 assemble_slots 等长补位 —— 跳镜会让后面所有切点错拍

assets:
  bgm: memory/assets/yike_pose/bgm.m4a
  slot_durations: [0.833, 0.6, 0.567, 1.0, 1.233, 2.3, 0.433, 0.533, 1.067]
  shot_01: memory/assets/yike_pose/shots/s01.mp4
  shot_02: memory/assets/yike_pose/shots/s02.mp4
  shot_03: memory/assets/yike_pose/shots/s03.mp4
  shot_04: memory/assets/yike_pose/shots/s04.mp4
  shot_05: memory/assets/yike_pose/shots/s05.mp4
  shot_06: memory/assets/yike_pose/shots/s06.mp4
  shot_07: memory/assets/yike_pose/shots/s07.mp4
  shot_08: memory/assets/yike_pose/shots/s08.mp4
  shot_09: memory/assets/yike_pose/shots/s09.mp4

pipelines:
  "1":
    - {id: ref_close_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: close, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_close, tool: image_edit,
       params: {base_image: "@ref_close_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: ref_medium_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: medium, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_medium, tool: image_edit,
       params: {base_image: "@ref_medium_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: ref_full_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: full, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_full, tool: image_edit,
       params: {base_image: "@ref_full_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: s01, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_01}}
    - {id: s02, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_02}}
    - {id: s03, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_03}}
    - {id: s04, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_04}}
    - {id: s05, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_05}}
    - {id: s06, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_full", driving: $skill.assets.shot_06}}
    - {id: s07, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_07}}
    - {id: s08, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_08}}
    - {id: s09, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_full", driving: $skill.assets.shot_09}}
    - {id: asm, tool: assemble_slots, local: true, lenient: true,
       params: {videos: ["@s01", "@s02", "@s03", "@s04", "@s05", "@s06", "@s07", "@s08", "@s09"],
                durations: $skill.assets.slot_durations, fill: repeat}}
    - {id: mixed, tool: mix_audio, local: true,
       params: {video: "@asm", bgm: $skill.assets.bgm, duration: 8.566, bgm_volume: 1.0}}
    - {id: out, tool: burn_text, local: true,
       params: {video: "@mixed", text: "{spec_line}", y_frac: 0.74, size: 34}}
  "2":
    - {id: ref_close_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: close, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_close, tool: image_edit,
       params: {base_image: "@ref_close_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: ref_medium_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: medium, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_medium, tool: image_edit,
       params: {base_image: "@ref_medium_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: ref_full_raw, tool: crop_ref, local: true,
       params: {image: $hook_1, frame: full, size: [720, 1280]}}  # 对齐成片画布 9:16: 输出比例跟参考图
    - {id: ref_full, tool: image_edit,
       params: {base_image: "@ref_full_raw", prompt: $skill.bg_prompt}}  # 白棚换生活感背景, 人物衣服不动
    - {id: s01, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_01}}
    - {id: s02, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_02}}
    - {id: s03, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_close", driving: $skill.assets.shot_03}}
    - {id: s04, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_04}}
    - {id: s05, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_05}}
    - {id: s06, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_full", driving: $skill.assets.shot_06}}
    - {id: s07, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_07}}
    - {id: s08, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_medium", driving: $skill.assets.shot_08}}
    - {id: s09, tool: animate_move, optional: true,
       params: {mode: wan-pro, ref: "@ref_full", driving: $skill.assets.shot_09}}
    - {id: asm, tool: assemble_slots, local: true, lenient: true,
       params: {videos: ["@s01", "@s02", "@s03", "@s04", "@s05", "@s06", "@s07", "@s08", "@s09"],
                durations: $skill.assets.slot_durations, fill: repeat}}
    - {id: mixed, tool: mix_audio, local: true,
       params: {video: "@asm", bgm: $skill.assets.bgm, duration: 8.566, bgm_volume: 1.0}}
    - {id: out, tool: burn_text, local: true,
       params: {video: "@mixed", text: "{spec_line}", y_frac: 0.74, size: 34}}
  # 双人交替(奇偶镜换 ref)留待后续; 现阶段两人计划也全用 hook_1

# 参考图背景(指令式图像编辑, 底图人物/衣服保留): 三档同一段描述 → 三张图
# 读作同一房间的不同距离; 描述写死具体陈设, 减少档间漂移
bg_prompt: |
  把纯白影棚背景替换为明亮的家居房间: 大落地窗带白色纱帘, 柔和自然日光,
  浅色木地板, 墙上一幅简约挂画, 角落一盆绿植。人物、发型、衣服、姿势、
  构图完全保持不变, 光线自然贴合。

text_params:
  spec_line:
    desc: 常驻规格贴字(原片位是"165cm|46kg"身高体重)。我们没有博主规格, 从商品
      brief 提炼一行转化信息, 例如"白/蓝 两色可选"。8-14 个字, 不带感叹号。

measured:
  verified: false
  date: 2026-08-31
  notes: 预检 s02/s03(近景)/s05(背面) std 全过; 胸像 ref → 近景输出已实证;
    节拍网格替身实拼 10/12 切点偏差 ≤0.017s; 边界经用户逐帧裁决后重切,
    景别经 cv2 客观定档(close=s01-03, medium=s04/05/07/08, full=s06/09)
