# 在线训练编排(S3):三进程解耦
policy:
  # vLLM 服 Qwen3;管线换脑只需把 configs/bailian.yaml 的
  # models.crew.video_brain 指到这里(OpenAICompatLLM 原生支持 vllm)
  serve: "vllm serve Qwen/Qwen3-8B --served-model-name brain --port 8000"
  crew_override:
    video_brain: {name: vllm, base_url: "http://localhost:8000/v1",
                  model: brain, max_tokens: 4096}
rollout:
  workers: 2                      # 并行 Maestro run 数(可灵限流约束)
  scripts:                        # 轮换剧本池(组内多 rollout 同剧本)
    - scripts/sim_scripts/s3_bakery.json
    - scripts/sim_scripts/s2_rooftop.json
    - scripts/sim_scripts/s5_rainstop.json
  per_script_rollouts: 4          # GRPO 组大小
  review: true                    # 必须开评审 —— task reward 的来源
collector:
  incremental: true               # 追踪新 run 目录,增量 join 追加
  poll_s: 120
trainer:
  batch_groups: 8
  staleness_max_versions: 3       # 只训 ≤3 个 checkpoint 版本内的样本
  save_every_steps: 50            # → vLLM 热载点
