# Maestro — 最基础真实配置（从这里开始）。
#
# 目标：把 multi-agent + 视频生成跑通，最少的真实后端，不碰 GPU / 物理 / 音频。
#   • 纯语言大模型 → OpenAI    （$OPENAI_API_KEY）
#   • 多模态大模型 → Gemini    （$GEMINI_API_KEY,任意能读视频帧的多模态模型）
#   • 视频生成     → WaveSpeed  （$WAVESPEED_API_KEY，云 API，无需本地 GPU）
#   • 其余（物理 tracker / 关键帧编辑 / 音频）一律 mock —— 先不开。
#
# 跑：
#   export OPENAI_API_KEY=...  GEMINI_API_KEY=...  WAVESPEED_API_KEY=...
#   maestro run-once --prompt "..." -o outputs/demo.mp4 --config configs/basic.yaml
# 不需要起 server。

models:
  # 纯语言大模型（编剧 / 导演 / 修复 / 验证）——只用 OpenAI。
  llm:
    name: "openai"
    model: "gpt-5.6-sol"   # brain 默认(2026-07-17 换代);gpt-5/o 系列自动用 max_completion_tokens、
                           # 不发 temperature(它们拒收);gpt-4o 等旧模型也兼容

  # 多模态大模型（语义/物理 VLM 评审 + 镜头对比 + 素材打标）。
  # Gemini 官方 generateContent 端点;$GEMINI_MODEL / $GEMINI_BASE_URL 可覆盖。
  # 备用:name: "qwen-vl" + model: "qwen-vl-max"($QWEN_API_KEY)。
  mllm:
    name: "gemini"
    model: "gemini-3.5-flash"
    n_frames: 4            # 抽帧后端(OpenAI 兼容 VLM)用;Gemini 走原生视频不抽帧
    video_fps: 5           # Gemini 原生视频的采样帧率(官方默认 1.0;调高 →
                           # 时间定位更准、token 也更多;范围 0-24)

  # 视频生成——只调 WaveSpeed API（真像素，无本地 GPU）。
  # 默认 = 当前效果最强的 seedance-2.0 全家桶（时长 4-15 秒任意整数，最高 4k；
  # i2v 原生支持首帧+尾帧）。旧模型（seedance-v1 / wan-flf2v）仍兼容：换 model_id 即可。
  video_gen:
    name: "wavespeed"
    model_id: "bytedance/seedance-2.0/text-to-video"   # i2v id 自动推导
    resolution: "480p"        # 测试期默认(省钱);产线再升 720p/1080p/4k
    generate_audio: false     # seedance-2.0 可原生出声；评审链路默认关
    # flf2v_model:  "bytedance/seedance-2.0/image-to-video"  # 首尾帧路由（默认）
    # edit_model:   "bytedance/seedance-2.0/video-edit"
    # extend_model: "bytedance/seedance-2.0/video-extend"
    poll_interval: 2.0
    timeout: 600
    # call_log: "outputs/wavespeed_calls.jsonl"  # 每次调用(模型+参数)落盘;
    #   test_window_movie.py 未配置时自动设为 <out_dir>/wavespeed_calls.jsonl

  # 以下先全部 mock —— 先把主链路跑通，之后再按需开启。
  track_extractor:
    name: "mock-track"      # 物理验证关闭：p2 中性（诚实标"未测量"，不伪造）
  image_edit:
    name: "mock-image-edit" # HSI Tier-0 关键帧编辑暂为 no-op
  audio_gen:
    name: "mock-audio-gen"  # 音频暂为占位

# 规划
plan:
  n_shots: 3
  max_shots: 6
  shot_duration: 3.0       # 仅旧阶梯管线用;窗口管线的时长由 brain 逐镜决定
  max_plan_iters: 3

# 评审员开关(可能不用纯 physics 评审 → 分支开关控制)
review:
  physics_vlm: true        # VLM 物理观点评审(看画面判断合理性)
  physics_measure: true    # 非 AI 测量链(basic 下 track 是 mock,中性;关掉即纯语义评审)

# 窗口式全片生成(pipeline/window_loop.py)
window:
  tail_seconds: 2.0        # tiv2v_window 策略截取上镜尾段的长度(秒),可调

# 生成 + 自改进循环
compose:
  fps: 8
  n_candidates: 2           # 每镜 best-of-N 候选数
  max_revisions: 5          # 自改进轮数上限(旧阶梯循环)
  k_retries: 2
  # 小循环轮数【自动】控制(brain 修复循环;max_turns 只是成本天花板):
  patience: 2               # 连续 N 轮被 Verifier 拒 → 止损停(≤0 关闭)
  quality_bar: null         # 总分 ≥ 此值且无高危缺陷 → 提前收工(如 0.75;null 关闭)

# 评审指标权重（驱动单调 Verifier）
metrics:
  weights:
    m1_semantic: 0.22
    m2_temporal: 0.13
    p1_physics: 0.22           # VLM 判的物理失效模式
    p2_law_consistency: 0.10   # mock-track 下中性（未测量）
    id1_identity: 0.13
    m5_rhythm: 0.10
    aesthetic: 0.10

physics:
  violation_threshold: 0.40

# 记忆（技能 / 实体 / 教训跨运行持久化；纯本地文件，无需配置）
memory:
  user_id: "default"
  enable_skills: true
  enable_entities: true
  enable_preferences: true
  enable_episodes: true
  enable_skill_admission: true
